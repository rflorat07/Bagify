name: bagify_ecommerce_bag_shop
description: "Bagify - Ecommerce Bag Shop App"
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^3.0.0
  riverpod_annotation: ^3.0.0

  # Navigation
  go_router: ^17.0.1

  # Networking
  dio: ^5.9.1
  json_annotation: ^4.9.0

  # Storage

  # Utilities
  freezed_annotation: ^3.1.0
  cached_network_image: ^3.4.1

  # UI
  flutter_svg: ^2.2.3
  iconsax_plus: ^1.0.0



dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Code Generation
  freezed: ^3.2.3
  build_runner: ^2.10.5
  riverpod_generator: ^3.0.3
  json_serializable: ^6.11.2

flutter:
  uses-material-design: true

  assets:
  - assets/images/
  - assets/icons/
  - assets/fonts/

  fonts:
    - family: Urbanist
      fonts:
        - asset: assets/fonts/Urbanist-Regular.ttf
          weight: 400
        - asset: assets/fonts/Urbanist-Medium.ttf
          weight: 500
        - asset: assets/fonts/Urbanist-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Urbanist-Bold.ttf
          weight: 700